name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Every link of the built site, the site's own addresses read from dist.
      # Pull requests only: a link that breaks elsewhere never holds a deploy.
      # A server that refuses bots (403) or is busy (429, 503) says nothing of
      # the link: npmjs.com and ACM refuse the runner, github.com throttles it.
      - name: Check links
        if: github.event_name == 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --accept '100..=103,200..=299,403,429,503'
            --root-dir ${{ github.workspace }}/dist
            --remap '^https://evref-bl\.github\.io/ file://${{ github.workspace }}/dist/'
            'dist/**/*.html'
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
